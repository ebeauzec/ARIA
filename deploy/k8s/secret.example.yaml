# Copy to secret.yaml, fill in, apply, and do NOT commit the filled-in copy.
# Optional. Without this Secret the first administrator is admin / Changeme1!, which must be changed at the first sign-in (do that before the Service is
# reachable by others). With it, the administrator is created with this password; remove ARIA_ADMIN_PASSWORD from the Secret afterwards.
apiVersion: v1
kind: Secret
metadata:
  name: aria-secrets
  namespace: aria
type: Opaque
stringData:
  ARIA_ADMIN_USER: admin
  ARIA_ADMIN_PASSWORD: "change-me-at-least-10-characters"
  # Optional: a fixed key for signing session cookies (otherwise one is generated on the volume).
  # ARIA_SESSION_SECRET: "a-long-random-string"
