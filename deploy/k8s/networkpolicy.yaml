# ARIA accepts traffic only from the ingress controller and sends traffic only to DNS and HTTPS (Active IQ and the public reference sources).
# Set the ingress controller's namespace label below. In header mode this policy is what stops anyone else from sending the user-name header.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aria
  namespace: aria
spec:
  podSelector:
    matchLabels: {app: aria}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {port: 8080}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {port: 443}
